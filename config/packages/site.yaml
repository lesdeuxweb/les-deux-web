# Identité du site, utilisée dans le layout (en-tête, pied de page) et plus tard dans le JSON-LD.
# Pour dupliquer le socle chez un client : modifier ce fichier et assets/styles/app.css (section 2).
# Une valeur vide (~) n'est pas affichée sur le site : la ligne ou le bloc correspondant est masqué.
parameters:
    site:
        nom: 'Les deux web'
        slogan: 'Création de sites internet à Limoges'
        devise: 'Sites d''ici, faits avec soin.'
        ville: 'Limoges'
        # Adresse (mentions légales, données structurées), ex. '12 rue Jean Jaurès' / '87000'
        adresse: ~
        code_postal: ~
        region: 'Nouvelle-Aquitaine'
        rayon_km: 100
        # Départements desservis en présentiel (données structurées pour Google)
        departements: ['Haute-Vienne', 'Dordogne', 'Charente', 'Corrèze', 'Creuse', 'Vienne', 'Indre']
        telephone: ~            # ex. '05 55 00 00 00'
        email: 'bonjour@lesdeuxweb.fr'
        # Mention affichée sous les tarifs (franchise en base de TVA). Vide si les prix sont HT/TTC.
        mention_tva: 'TVA non applicable, art. 293 B du CGI'
        # Photo du hero de l'accueil (chemin dans assets/images/), null = emplacement « photo à venir »
        photo_accueil: null
        # Associés (section « Qui sommes-nous ? »). photo : chemin dans assets/images/, ex. 'equipe/prenom.webp'
        associes:
            -   prenom: ~
                role: 'Développement'
                photo: ~
            -   prenom: ~
                role: 'Gestion de projet et relation client'
                photo: ~

        # Mentions légales (page /mentions-legales et politique de confidentialité)
        legal:
            # Obligatoires avant la mise en ligne (loi pour la confiance dans l'économie numérique)
            raison_sociale: ~         # ex. 'Les deux web' ou nom de l'entrepreneur
            forme_juridique: ~        # ex. 'Entrepreneur individuel (micro-entreprise)'
            siret: ~
            rcs: ~                    # ex. 'RCS Limoges 000 000 000' (si applicable)
            tva: ~                    # n° de TVA intracommunautaire (si applicable)
            directeur_publication: ~  # ex. 'Prénom Nom, gérant'
            # Date de dernière mise à jour de la politique de confidentialité, ex. '1er novembre 2026'
            politique_mise_a_jour: ~
        hebergeur:
            nom: 'OVH SAS'
            adresse: '2 rue Kellermann, 59100 Roubaix, France'
            telephone: '1007'
            site: 'https://www.ovhcloud.com'

    # Mesure d'audience Matomo (facultative) : rien n'est chargé si l'une des deux variables est vide.
    # Valeurs par défaut : le site fonctionne même si les variables ne sont pas définies.
    env(MATOMO_URL): ''
    env(MATOMO_SITE_ID): ''
    matomo:
        url: '%env(MATOMO_URL)%'
        site_id: '%env(MATOMO_SITE_ID)%'

twig:
    globals:
        site: '%site%'
        matomo: '%matomo%'
