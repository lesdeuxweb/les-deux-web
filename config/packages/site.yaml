# Identité du site, utilisée dans le layout (en-tête, pied de page) et plus tard dans le JSON-LD.
# Pour dupliquer le socle chez un client : modifier ce fichier et assets/styles/app.css (section 2).
# Les valeurs entre crochets sont affichées comme « à compléter » sur le site.
parameters:
    site:
        nom: 'Les deux web'
        slogan: 'Création de sites internet à Limoges'
        ville: 'Limoges'
        # Adresse (mentions légales, données structurées). Les valeurs entre crochets sont omises du JSON-LD.
        adresse: '[À COMPLÉTER : numéro et rue]'
        code_postal: '[À COMPLÉTER]'
        region: 'Nouvelle-Aquitaine'
        rayon_km: 200
        telephone: '[À COMPLÉTER]'
        email: '[À COMPLÉTER]'
        # Associés (page Qui sommes-nous, accueil). photo : chemin dans assets/images/, ex. 'equipe/prenom.webp'
        associes:
            -   prenom: '[À COMPLÉTER : prénom]'
                role: 'Développement'
                photo: null
                presentation: '[À COMPLÉTER : quelques phrases de présentation, parcours, ce qui plaît dans le métier.]'
            -   prenom: '[À COMPLÉTER : prénom]'
                role: 'Gestion de projet et relation client'
                photo: null
                presentation: '[À COMPLÉTER : quelques phrases de présentation, parcours, ce qui plaît dans le métier.]'

        # Mentions légales (page /mentions-legales et politique de confidentialité)
        legal:
            raison_sociale: '[À COMPLÉTER : raison sociale]'
            forme_juridique: '[À COMPLÉTER : forme juridique et capital, ex. SAS au capital de 1 000 €]'
            siret: '[À COMPLÉTER : n° SIRET]'
            rcs: '[À COMPLÉTER : immatriculation, ex. RCS Limoges 000 000 000 (si applicable)]'
            tva: '[À COMPLÉTER : n° de TVA intracommunautaire (si applicable)]'
            directeur_publication: '[À COMPLÉTER : prénom, nom et qualité, ex. gérant]'
        hebergeur:
            nom: 'OVH SAS'
            adresse: '2 rue Kellermann, 59100 Roubaix, France'
            telephone: '1007'
            site: 'https://www.ovhcloud.com'

    # Mesure d'audience Matomo (facultative) : rien n'est chargé si l'une des deux variables est vide.
    # Valeurs par défaut : le site fonctionne même si les variables ne sont pas définies.
    env(MATOMO_URL): ''
    env(MATOMO_SITE_ID): ''
    matomo:
        url: '%env(MATOMO_URL)%'
        site_id: '%env(MATOMO_SITE_ID)%'

twig:
    globals:
        site: '%site%'
        matomo: '%matomo%'
