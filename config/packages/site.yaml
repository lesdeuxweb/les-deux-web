# Identité du site, utilisée dans le layout (en-tête, pied de page) et plus tard dans le JSON-LD.
# Pour dupliquer le socle chez un client : modifier ce fichier et assets/styles/app.css (section 2).
# Les valeurs entre crochets sont affichées comme « à compléter » sur le site.
parameters:
    site:
        nom: 'Les deux web'
        slogan: 'Création de sites internet à Limoges'
        ville: 'Limoges'
        # Adresse (mentions légales, données structurées). Les valeurs entre crochets sont omises du JSON-LD.
        adresse: '[À COMPLÉTER : numéro et rue]'
        code_postal: '[À COMPLÉTER]'
        region: 'Nouvelle-Aquitaine'
        rayon_km: 200
        telephone: '[À COMPLÉTER]'
        email: '[À COMPLÉTER]'
        # Associés (page Qui sommes-nous, accueil). photo : chemin dans assets/images/, ex. 'equipe/prenom.webp'
        associes:
            -   prenom: '[À COMPLÉTER : prénom]'
                role: 'Développement'
                photo: null
                presentation: '[À COMPLÉTER : quelques phrases de présentation, parcours, ce qui plaît dans le métier.]'
            -   prenom: '[À COMPLÉTER : prénom]'
                role: 'Gestion de projet et relation client'
                photo: null
                presentation: '[À COMPLÉTER : quelques phrases de présentation, parcours, ce qui plaît dans le métier.]'

twig:
    globals:
        site: '%site%'
