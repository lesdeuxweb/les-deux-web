# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # La session n'est démarrée qu'en cas de besoin (connexion à l'admin, message flash du contact) :
    # les pages publiques ne déposent aucun cookie (voir la politique de confidentialité).
    session:
        name: 'session'
        cookie_lifetime: 0      # cookie supprimé à la fermeture du navigateur
        cookie_secure: auto     # Secure dès que le site est en HTTPS
        cookie_httponly: true
        cookie_samesite: lax

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
