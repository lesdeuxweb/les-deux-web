
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "3307:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  # Boîte mail de développement : interface web sur http://localhost:8025
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
